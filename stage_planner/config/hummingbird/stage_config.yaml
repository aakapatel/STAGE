frame_id: "world"
odometry_topic: "/hummingbird/ground_truth/odometry"
point_cloud_topic: "/hummingbird/velodyne_points"
local_AABB_size: 20 
local_FOV: 40
num_edges_max: 10
max_edge_length: 4
sampling_iterations: 2000
knn_range: 2
robot_type: "kAerial" #"kLegged"     
safety_margin: [0.3, 0.3, 0.3]
robot_size: [0.4, 0.4, 0.4]
octree_resolution: 0.5
frontier_detection_range: 10
frontier_clearing_range: 8
unknowns_threashold: 4 
truncate_frontier_Z: 6
truncate_sample_Z: 4

SensorParams:
  sensor_list:      ["OS064"]
  OS064:
    type:           kLidar
    max_range:      4.0
    center_offset:  [0.0, 0.0, 0.0]
    rotations:      [0.0, 0.0, 0.0]
    fov:            [rad(2*pi), rad(pi/2)]
    resolution:     [rad(7.0*pi/180), rad(7.0*pi/180)]
    frontier_percentage_threshold: 0.1







########## DO NOT TOUCH ############

sensor_model_hits: 0.7
sensor_model_miss: 0.4
sensor_model_min: 0.12
sensor_model_max: 0.97
